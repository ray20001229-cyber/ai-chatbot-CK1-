<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 客服工作台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div>
      <h1>AI 客服工作台</h1>
      <p>聊天分析、会话记忆、到期提醒、客户与任务管理</p>
    </div>
    <button id="refreshAll" class="secondary">刷新全部</button>
  </header>
  <main>
    <section>
      <h2>数据统计</h2>
      <div id="dashboard" class="dashboard">加载中……</div>
    </section>

    <section class="alert-section">
      <div class="section-title">
        <h2>提醒中心</h2>
        <button id="scanReminders">立即扫描</button>
      </div>
      <div id="reminders">加载中……</div>
    </section>

    <section>
      <div class="section-title">
        <h2>多渠道消息中心</h2>
        <span class="hint">微信 · 邮件 · 在线客服 · WebSocket 实时聊天</span>
      </div>
      <form id="conversationForm" class="conversation-form">
        <select id="conversationChannel">
          <option value="web">网页聊天</option>
          <option value="support">在线客服</option>
          <option value="wechat">微信</option>
          <option value="email">邮件</option>
        </select>
        <input id="conversationExternalId" required placeholder="外部会话ID/客户标识">
        <input id="conversationSubject" placeholder="会话主题">
        <button type="submit">创建会话</button>
      </form>
      <div class="message-center">
        <aside id="conversationList">加载中……</aside>
        <div class="chat-panel">
          <div id="chatTitle" class="chat-title">请选择会话</div>
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm">
            <div class="chat-controls">
              <select id="chatSenderType">
                <option value="agent">客服发送</option>
                <option value="customer">模拟客户</option>
              </select>
              <input id="chatSenderName" value="本地客服" placeholder="发送者名称">
            </div>
            <textarea id="chatContent" rows="3" placeholder="输入消息……"></textarea>
            <div class="actions">
              <input id="chatAttachment" type="file"
                accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.csv,.docx,.xlsx">
              <button type="submit">实时发送</button>
            </div>
          </form>
          <div id="chatAttachments"></div>
        </div>
      </div>
    </section>

    <div class="two-column">
      <section>
        <h2>客户资料</h2>
        <form id="customerForm" class="form-grid">
          <input id="customerExternalId" required placeholder="客户编号">
          <input id="customerName" required placeholder="客户姓名">
          <input id="customerPhone" placeholder="手机号">
          <input id="customerEmail" type="email" placeholder="邮箱">
          <textarea id="customerNotes" rows="2" placeholder="备注"></textarea>
          <button type="submit">新增客户</button>
        </form>
        <div id="customers">加载中……</div>
      </section>

      <section>
        <h2>AI 聊天分析</h2>
        <label for="conversationId">会话编号</label>
        <input id="conversationId" value="default" maxlength="100">
        <label for="customerSelect">关联客户</label>
        <select id="customerSelect"><option value="">不关联客户</option></select>
        <textarea id="transcript" rows="10"
          placeholder="客户：我的退款三天了还没到账……"></textarea>
        <div class="actions">
          <button id="analyze">分析聊天</button>
          <button id="confirm" disabled>确认并保存任务</button>
        </div>
        <p id="message"></p>
        <pre id="result">尚未分析</pre>
      </section>
    </div>

    <section>
      <h2>会话记忆</h2>
      <p class="hint">同一会话的未完成和延期事项会在下次分析时自动召回。</p>
      <div id="memories">加载中……</div>
    </section>

    <section>
      <div class="section-title">
        <h2>日历安排</h2>
        <span class="hint">任务截止时间和延期恢复时间会自动同步</span>
      </div>
      <form id="calendarForm" class="calendar-form">
        <input id="calendarTitle" required placeholder="手动事件标题">
        <input id="calendarStart" type="datetime-local" required>
        <input id="calendarEnd" type="datetime-local">
        <button type="submit">添加日历事件</button>
      </form>
      <div id="calendarEvents">加载中……</div>
    </section>

    <section>
      <div class="section-title">
        <h2>任务管理</h2>
        <select id="taskFilter">
          <option value="">全部状态</option>
          <option value="pending">待处理</option>
          <option value="in_progress">办理中</option>
          <option value="completed">已完成</option>
        </select>
      </div>
      <div id="tasks">加载中……</div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
